{% extends "base.html" %}
{% block titulo %}Entrar · RRHH Minoshkas{% endblock %}
{% block contenido %}
<div class="login">
  <h1>RRHH <strong>Minoshkas</strong></h1>
  <p class="sutil">Ingresa con tu correo y contraseña.</p>
  {% if error %}<p class="alerta">{{ error }}</p>{% endif %}
  <form method="post" action="/login" class="tarjeta">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Correo<input type="email" name="email" value="{{ email or '' }}" required autofocus></label>
    <label>Contraseña<input type="password" name="password" required></label>
    <button type="submit" class="btn">Entrar</button>
  </form>
</div>
{% endblock %}
